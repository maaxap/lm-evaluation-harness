task: bewsc_generative_zero_shot_be
dataset_path: maaxap/bewsc
include: "_template_yaml"
num_fewshot: 0
test_split: test
doc_to_text: "Перад вамі сказ, у якім ёсць займеннік (напрыклад, 'яна') і паўназначнае слова, да якога ён можа адносіцца. Ваша задача – вызначыць, ці адпаведяе займеннік паўназначнаму слову. Выберыце адказ '1', калі займеннік адносіцца да паўназначнага і яны звязаныя правільна. Выберыце адказ '0', калі паўназначнае слова і займеннік звязаныя няправільна.\n\nСказ: {{ text }}\n\nЗайменнік: {{ span2_text }}\n\nПаўназначнае слова: {{ span1_text }}\n\nАдказ:"
doc_to_decontamination_query: "{{ text }} {{ span1_txt }} {{ span2_txt }}"
