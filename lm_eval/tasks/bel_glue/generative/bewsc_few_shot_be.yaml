doc_to_text: "Перад вамі сказ, у якім ёсць займеннік (напрыклад, 'яна') і паўназначнае слова, да якога ён можа адносіцца. Ваша задача – вызначыць, ці адпаведяе займеннік паўназначнаму слову. Выберыце адказ '1', калі займеннік адносіцца да паўназначнага і яны звязаныя правільна. Выберыце адказ '0', калі паўназначнае слова і займеннік звязаныя няправільна. Прыклады:\n\nСказ 1: Нават смелы воін быў бяссільны супраць лютага льва, і нават востры меч не мог дапамагчы яму.\nСказ 2: Нават востры меч не мог дапамагчы воіну.\nАдказ: 1\n\nСказ 1: Конь у дзядзькі пародзісты, і ён не шкадуе аўса.\nСказ 2: Дзядзька не шкадуе аўса.\nАдказ: 1\n\nСказ 1: Людка адзначыла, што Аксана, мусіць, сапраўды чараўніца, бо яна нізавошта б не здагадалася, што адбудзецца сёння.\nСказ 2: Людка нізавошта б не здагадалася, што адбудзецца сёння.\nАдказ: 1\n\nВыберыце адказ '0', калі другі сказ не з’яўляецца вывадам з першага (паўназначнае слова і займеннік звязаныя няправільна). Прыклады:\n\nСказ 1: Я апусціў гарачую далонь у ваду, і яна астыла.\nСказ 2: Вада астыла.\nАдказ: 0\n\nСказ 1: Суразмоўцу ўсхвалявала бяда хлопчыка, таму ён прапанаваў яму прытулак.\nСказ 2: Хлопчык прапанаваў суразмоўцу прытулак.\nАдказ: 0\n\nСказ 1: Маці нікуды не пускала дачку, хоць ёй хацелася пабыць сярод моладзі.\nСказ 2: Маці хацелася пабыць сярод моладзі.\nАдказ: 0\n\nКалі вам падаецца, што ніводны адказ не з’яўляецца правільным, выберыце той, што падыходзіць больш.\n\nВось яшчэ 5 прыкладаў:\n\nСказ 1: Малпы кінуліся па арэхі для Маўглі, але па дарозе яны пагубляліся.\nСказ 2: Арэхі пагубляліся.\nАдказ: 1\n\nСказ 1: Калі маці пужала дзяўчынку, яна верыла кожнаму свайму слову.\nСказ 2: Дзяўчынка верыла кожнаму свайму слову.\nАдказ: 0\n\nСказ 1: Робаты прадбачвалi любое жаданне гасцей, хаця ім было цяжка дагадзіць.\nСказ 2: Гасцям было цяжка дагадзіць.\nАдказ: 1\n\nСказ 1: Рой шпурнуў палку ў бок савы, але яна не даляцела.\nСказ 2: Палка не даляцела.\nАдказ: 1\n\nСказ 1: Я закінуў заплечнік пад ложак і паспрабаваў забыцца пра яго.\nСказ 2: Я паспрабаваў забыцца пра ложак.\nАдказ: 0\n\nЦяпер сказ і слова для ацэнкі. Сказ: {{ text }}\n\nЗайменнік: {{ span2_text }}\n\nПаўназначнае слова: {{ span1_text }}\n\nАдказ:"
