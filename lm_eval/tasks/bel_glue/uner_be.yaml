task: bel_glue_uner_be
dataset_path: maaxap/uner_alt
output_type: generate_until
generation_kwargs:
  temperature: 0.0
  until:
    - "\n\nHuman:"
test_split: test
num_fewshot: 0
fewshot_split: validation
fewshot_config:
  sampler: first_n
doc_to_text: !function utils.doc_to_text_be
doc_to_target: !function utils.doc_to_target
doc_to_decontamination_query: "{{ text }}"

filter_list:
  - name: "score-first"
    filter:
      - function: "remove_whitespace"
      - function: "take_first"

metric_list:
  - metric: !function utils.intersection
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
